version: '3.8'

# Hybrid mode: only Neo4j runs in Docker.
# Backend and frontend run natively for PC control access.

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: evoswarm-neo4j
    hostname: evoswarm-neo4j
    ports:
      - "7474:7474"  # HTTP (browser UI)
      - "7687:7687"  # Bolt (driver)
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
